name: Build and Test
on:
  push:
  workflow_dispatch:
jobs:
  format-check:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.0
    - name: Check formatting
      run: |
        clang-format --version
        find src test -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.cu' -o -name '*.cuh' \
          | xargs clang-format --dry-run --Werror

  test-project:
    strategy:
      matrix:
        build_type: [Debug, Release]
        toolchain:
          - {compiler: gcc, version: 13}
          - {compiler: intel, version: '2025.0'}
          #todo flang...
    name: Test Dalotia
    runs-on: ubuntu-latest
    steps:
    - name: install valgrind
      run: sudo apt update && sudo apt-get install valgrind

    - name: set up Fortran compiler
      uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: ${{ matrix.toolchain.compiler }}
        version: ${{ matrix.toolchain.version }}
        # -> environment vars FC, CC, and CXX are set
    - name: Checkout
      uses: actions/checkout@v4.2.0

    - name: Configure and Build Project
      uses: threeal/cmake-action@v1.3.0
      with:
        run-build: true
        options: DALOTIA_WITH_TENSORFLOW=ON
        build-args: --config ${{ matrix.build_type }}
        # cxx-compiler: ${{ matrix.compiler }}
        build-dir: build-${{ matrix.build_type }}

    - name: Test Project
      uses: threeal/ctest-action@v1.1.0
      with:
        test-dir: build-${{ matrix.build_type }}
        args: --output-on-failure -T memcheck
    - name: Output Memcheck Log
      run: for i in /home/runner/work/dalotia/dalotia/build-*/Testing/Temporary/MemoryChecker.*.log ; do echo $i ; cat $i ; done

  test-cuda:
    name: Build + test with CUDA/cuFile (no GPU!)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.0

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@8022558310ea543e35132143092835585f60e628 # v0.2.21
      id: cuda-toolkit
      with:
        cuda: '12.6.3'
        method: 'network'
        sub-packages: '["nvcc", "cudart-dev"]'
        non-cuda-sub-packages: '["libcufile-dev", "libcublas-dev"]'

    - name: Configure and Build with cuFile
      uses: threeal/cmake-action@v1.3.0
      with:
        run-build: true
        options: DALOTIA_WITH_CUFILE=ON DALOTIA_BUILD_TESTS=ON DALOTIA_WITH_FORTRAN=OFF
        build-dir: build-cuda

    - name: Run tests
      uses: threeal/ctest-action@v1.1.0
      with:
        test-dir: build-cuda
        args: --verbose --exclude-regex "cufile-pointer-detection|cuda-memory-resource"
